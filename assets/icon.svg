<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />

  <!-- Persian Vav / Vazir glyph stylization -->
  <path d="M 66 38 C 54 38 46 45 46 54 C 46 62 52 68 60 68 C 62.5 68 65 67.2 67 66 L 56 88 C 54 92 50 94 44 94 L 40 94 C 38 94 37 95 37 96.5 C 37 98 38 99 40 99 L 45 99 C 55 99 62 94 66 84 L 75 63 C 78 58 80 52 80 47 C 80 42 74 38 66 38 Z M 65 58 C 59 58 56 55 56 51 C 56 46 60 44 65 44 C 70 44 72 47 72 51 C 72 55 69 58 65 58 Z" fill="url(#primaryGrad)" />

  <!-- LaTeX Math symbols (Integral & Sigma badge) -->
  <g transform="translate(82, 74)">
    <circle cx="16" cy="16" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <!-- Math integral symbol -->
    <path d="M 12 24 C 11 24 10 23.5 10 22 C 10 20 12 18 14 16 L 17 12 C 18 10 18.5 8.5 18 8 C 17.5 7.5 16 7.5 15 8 L 14.5 9 C 14 9.5 13.5 9.5 13 9 C 12.5 8.5 12.5 8 13 7.5 C 14.5 6 16.5 5.5 18.5 6 C 20.5 6.5 21.5 8 21 10 C 20.5 12 18.5 14 16.5 16 L 13.5 20 C 12.5 22 12.5 23 13 23.5 C 13.5 24 15 24 16 23.5 L 16.5 22.5 C 17 22 17.5 22 18 22.5 C 18.5 23 18.5 23.5 18 24 C 16.5 25.5 14 25.5 12 24 Z" fill="url(#accentGrad)" />
    <!-- Math small sigma/x symbol -->
    <text x="21" y="21" font-family="serif" font-style="italic" font-size="10" fill="#38bdf8">x</text>
  </g>
</svg>
